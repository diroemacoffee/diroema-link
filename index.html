<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    min-height:100vh;

    background:
    linear-gradient(
        rgba(0,0,0,.35),
        rgba(0,0,0,.35)
    ),
    url('https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=2000&q=80');

    background-size:cover;
    background-position:center;
    background-attachment:fixed;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:24px;
}

.card{

    width:min(92vw,560px);

    backdrop-filter:blur(26px);
    -webkit-backdrop-filter:blur(26px);

    background:rgba(255,255,255,.08);

    border:1px solid rgba(255,255,255,.12);

    border-radius:36px;

    padding:38px 34px;

    text-align:center;

    box-shadow:
    0 25px 60px rgba(0,0,0,.35);

}

.logo{
    width:320px;
    max-width:95%;
    height:auto;

    margin-bottom:16px;
}

h1{

    font-size:42px;
    font-weight:700;

    letter-spacing:8px;

    color:#f5f1e8;

    margin-bottom:8px;
}

.subtitle{

    color:rgba(255,255,255,.85);

    font-size:17px;

    line-height:1.9;

    margin-bottom:30px;
}

.links{

    display:flex;
    flex-direction:column;

    gap:16px;
}

.link-btn{

    display:flex;

    align-items:center;
    justify-content:center;

    gap:14px;

    width:100%;

    padding:20px;

    text-decoration:none;

    color:#ffffff;

    font-size:20px;

    font-weight:600;

    border-radius:22px;

    background:rgba(255,255,255,.10);

    border:1px solid rgba(255,255,255,.12);

    transition:.25s ease;
}

.link-btn:hover{

    transform:translateY(-4px);

    background:rgba(255,255,255,.18);

    border-color:rgba(255,255,255,.22);

    box-shadow:
    0 12px 30px rgba(0,0,0,.18);
}

.link-btn i{

    font-size:22px;
}

.footer{

    margin-top:28px;

    color:rgba(255,255,255,.65);

    font-size:13px;

    letter-spacing:1px;
}

@media(max-width:480px){

    .card{
        padding:28px 22px;
    }

    .logo{
        width:260px;
    }

    h1{
        font-size:34px;
        letter-spacing:5px;
    }

    .link-btn{
        font-size:18px;
        padding:18px;
    }

}

</style>
</head>

<body>

<div class="card">

    <img src="logo.png" class="logo" alt="Diroema Coffee">

    <p class="subtitle">
        Drink • Chill • Connect
        <br>
        Coffee • Community • Conversation
    </p>

    <div class="links">

        <a href="https://maps.app.goo.gl/MZwPLTi4Gw5A9pPg7"
           class="link-btn"
           target="_blank">
            <i class="fa-solid fa-location-dot"></i>
            Google Maps
        </a>

        <a href="https://wa.me/6285555550615"
           class="link-btn"
           target="_blank">
            <i class="fa-brands fa-whatsapp"></i>
            WhatsApp
        </a>

        <a href="https://instagram.com/diroemacoffee"
           class="link-btn"
           target="_blank">
            <i class="fa-brands fa-instagram"></i>
            Instagram
        </a>

        <a href="https://tiktok.com/@diroemacoffee"
           class="link-btn"
           target="_blank">
            <i class="fa-brands fa-tiktok"></i>
            TikTok
        </a>

        <a href="/menu"
           class="link-btn">
            <i class="fa-solid fa-book-open"></i>
            Menu
        </a>

    </div>

    <div class="footer">
        © 2026 DIROEMA COFFEE
    </div>

</div>

</body>
</html>
