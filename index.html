<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    min-height:100vh;

    background:url('https://images.unsplash.com/photo-1495474472287-4d71bcdd2085');
    background-size:cover;
    background-position:center;
    background-attachment:fixed;

    display:flex;
    justify-content:center;
    align-items:center;
    padding:24px;

    color:#f0eee6;
}

.card{
    width:100%;
    max-width:430px;

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.12);

    border-radius:28px;
    padding:40px 30px;

    text-align:center;

    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.logo{
    width:350px;
    max-width:70%;
    height:auto;
    margin-bottom:10px;
}

h1{
    font-family:'Cormorant Garamond',serif;
    font-size:42px;
    font-weight:600;
    letter-spacing:.5px;
    color:#f0eee6;
}

.subtitle{
    margin-top:10px;
    color:#d8d5ca;
    font-size:14px;
    line-height:1.8;
}

.links{
    margin-top:32px;
    display:flex;
    flex-direction:column;
    gap:14px;
}

.link-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;

    text-decoration:none;
    color:#f0eee6;

    padding:16px;
    border-radius:18px;

    background:rgba(255,255,255,0.06);
    border:1px solid rgba(240,238,230,0.10);

    transition:all .25s ease;

    font-weight:500;

    backdrop-filter:blur(8px);
}

.link-btn:hover{
    transform:translateY(-4px) scale(1.02);

    background:rgba(240,238,230,0.10);
    border-color:rgba(240,238,230,0.20);

    box-shadow:0 10px 25px rgba(0,0,0,.15);
}

.link-btn i{
    font-size:20px;
}

.footer{
    margin-top:28px;
    font-size:12px;
    color:#cfcabf;
    opacity:.75;
}

@media (max-width:480px){

    .card{
        padding:30px 22px;
    }

    h1{
        font-size:36px;
    }

    .logo{
        width:160px;
    }
}

</style>
</head>

<body>

<div class="card">

    <img src="logo.png" class="logo" alt="Diroema Coffee Logo">

    <p class="subtitle">
        Drink • Chill • Connect
        <br>
        Coffee • Community • Conversation
    </p>

    <div class="links">

        <a href="https://maps.app.goo.gl/MZwPLTi4Gw5A9pPg7" class="link-btn" target="_blank">
            <i class="fa-solid fa-location-dot"></i>
            Google Maps
        </a>

        <a href="https://wa.me/6281234567890" class="link-btn" target="_blank">
            <i class="fa-brands fa-whatsapp"></i>
            WhatsApp
        </a>

        <a href="https://instagram.com/diroemacoffee" class="link-btn" target="_blank">
            <i class="fa-brands fa-instagram"></i>
            Instagram
        </a>

        <a href="https://tiktok.com/@diroemacoffee" class="link-btn" target="_blank">
            <i class="fa-brands fa-tiktok"></i>
            TikTok
        </a>

        <a href="/menu" class="link-btn">
            <i class="fa-solid fa-book-open"></i>
            Menu
        </a>

    </div>

    <div class="footer">
        © 2026 Diroema Coffee
    </div>

</div>

</body>
</html>
