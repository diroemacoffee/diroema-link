<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diroema Coffee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    font-family:'Inter',sans-serif;
    min-height:100vh;
    background:
        linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.35)),
        url('https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=2000&q=80');
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:24px;
}

/* ===== CARD UTAMA ===== */
.card{
    width:min(92vw,560px);
    backdrop-filter:blur(26px);
    -webkit-backdrop-filter:blur(26px);
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    border-radius:36px;
    padding:38px 34px;
    display:flex;
    flex-direction:column;
    align-items:center;
    box-shadow:0 25px 60px rgba(0,0,0,.35);
}
.logo{
    width:320px;
    max-width:95%;
    height:auto;
    margin:0 auto 16px auto;
    display:block;
}
.subtitle{
    color:rgba(255,255,255,.85);
    font-size:17px;
    line-height:1.9;
    margin-bottom:30px;
    text-align:center;
    width:100%;
}
.links{
    display:flex;
    flex-direction:column;
    gap:16px;
    width:100%;
}
.link-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    width:100%;
    padding:20px;
    text-decoration:none;
    color:#ffffff;
    font-size:20px;
    font-weight:600;
    border-radius:22px;
    background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.12);
    transition:.25s ease;
    cursor:pointer;
}
.link-btn:hover{
    transform:translateY(-4px);
    background:rgba(255,255,255,.18);
    border-color:rgba(255,255,255,.22);
    box-shadow:0 12px 30px rgba(0,0,0,.18);
}
.link-btn i{font-size:22px;}
.footer{
    margin-top:28px;
    color:rgba(255,255,255,.65);
    font-size:13px;
    letter-spacing:1px;
    text-align:center;
    width:100%;
}

/* ===== MENU MODAL OVERLAY ===== */
.modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    z-index:999;
    justify-content:center;
    align-items:flex-start;
    padding:24px;
    overflow-y:auto;
}
.modal-overlay.active{display:flex;}

.modal-box{
    background:rgba(25,15,10,.96);
    border:1px solid rgba(255,255,255,.12);
    border-radius:28px;
    padding:32px 28px;
    width:min(95vw,560px);
    margin:auto;
    position:relative;
}
.modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:24px;
}
.modal-title{
    color:#f5f1e8;
    font-size:20px;
    font-weight:700;
    letter-spacing:4px;
}
.modal-close{
    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.15);
    color:#fff;
    font-size:16px;
    width:36px;
    height:36px;
    border-radius:50%;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:.2s;
    flex-shrink:0;
}
.modal-close:hover{background:rgba(255,255,255,.2);}

/* Kategori */
.menu-category{margin-bottom:24px;}
.menu-category:last-child{margin-bottom:0;}
.category-label{
    color:rgba(255,255,255,.4);
    font-size:11px;
    font-weight:600;
    letter-spacing:2.5px;
    text-transform:uppercase;
    margin-bottom:12px;
}
.menu-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}
.menu-item{
    border-radius:16px;
    overflow:hidden;
    cursor:pointer;
    border:1px solid rgba(255,255,255,.08);
    transition:.2s ease;
}
.menu-item:hover{
    transform:scale(1.03);
    border-color:rgba(255,255,255,.2);
}
.menu-item img{
    width:100%;
    aspect-ratio:4/3;
    object-fit:cover;
    display:block;
}
.menu-item-name{
    padding:8px 10px;
    background:rgba(0,0,0,.55);
    color:#f5f1e8;
    font-size:13px;
    font-weight:500;
    text-align:center;
}

/* ===== LIGHTBOX ===== */
.lightbox{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.92);
    z-index:1000;
    justify-content:center;
    align-items:center;
    padding:16px;
}
.lightbox.active{display:flex;}
.lightbox img{
    max-width:100%;
    max-height:88vh;
    border-radius:18px;
    object-fit:contain;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
}
.lb-close{
    position:fixed;
    top:16px;
    right:20px;
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.15);
    color:#fff;
    font-size:18px;
    width:40px;
    height:40px;
    border-radius:50%;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:.2s;
    z-index:1001;
}
.lb-close:hover{background:rgba(255,255,255,.25);}

/* ===== RESPONSIVE ===== */
@media(max-width:480px){
    .card{padding:28px 22px;}
    .logo{width:260px;}
    .link-btn{font-size:18px;padding:18px;}
    .modal-box{padding:24px 18px;}
    .menu-grid{gap:8px;}
}
</style>
</head>
<body>

<!-- ===== MAIN CARD ===== -->
<div class="card">
    <!-- Ganti src dengan path logo kamu, contoh: logo.png -->
    <img src="logo.png" class="logo" alt="Diroema Coffee">

    <p class="subtitle">
        Drink • Chill • Connect
        <br>
        Coffee • Community • Conversation
    </p>

    <div class="links">
        <a href="https://maps.app.goo.gl/MZwPLTi4Gw5A9pPg7"
           class="link-btn" target="_blank">
            <i class="fa-solid fa-location-dot"></i>
            Google Maps
        </a>
        <a href="https://wa.me/6285555550615"
           class="link-btn" target="_blank">
            <i class="fa-brands fa-whatsapp"></i>
            WhatsApp
        </a>
        <a href="https://instagram.com/diroemacoffee"
           class="link-btn" target="_blank">
            <i class="fa-brands fa-instagram"></i>
            Instagram
        </a>
        <a href="https://tiktok.com/@diroemacoffee"
           class="link-btn" target="_blank">
            <i class="fa-brands fa-tiktok"></i>
            TikTok
        </a>
        <a href="#" class="link-btn" onclick="openMenu(event)">
            <i class="fa-solid fa-book-open"></i>
            Menu
        </a>
    </div>

    <div class="footer">© 2026 DIROEMA COFFEE</div>
</div>


<!-- ===== MENU MODAL ===== -->
<div id="menuModal" class="modal-overlay" onclick="handleOverlayClick(event)">
    <div class="modal-box">
        <div class="modal-header">
            <span class="modal-title">OUR MENU</span>
            <button class="modal-close" onclick="closeMenu()">✕</button>
        </div>

        <!-- KATEGORI: Minuman -->
        <!-- Ganti src foto dengan path foto menu kamu, contoh: menu/kopi-susu.jpg -->
        <div class="menu-category">
            <div class="category-label">Minuman</div>
            <div class="menu-grid">
                <div class="menu-item" onclick="openLightbox('menu/kopi-susu-aren.jpg')">
                    <img src="menu/kopi-susu-aren.jpg" alt="Kopi Susu Aren">
                    <div class="menu-item-name">Aren Latte</div>
                </div>
                <div class="menu-item" onclick="openLightbox('menu/matcha-latte.jpg')">
                    <img src="menu/matcha-latte.jpg" alt="Matcha Latte">
                    <div class="menu-item-name">Matcha Latte</div>
                </div>
                <div class="menu-item" onclick="openLightbox('menu/americano.jpg')">
                    <img src="menu/americano.jpg" alt="Americano">
                    <div class="menu-item-name">Americano</div>
                </div>
                <div class="menu-item" onclick="openLightbox('menu/cappuccino.jpg')">
                    <img src="menu/cappuccino.jpg" alt="Cappuccino">
                    <div class="menu-item-name">Cappuccino</div>
                </div>
            </div>
        </div>

        <!-- KATEGORI: Makanan -->
        <div class="menu-category">
            <div class="category-label">Makanan</div>
            <div class="menu-grid">
                <div class="menu-item" onclick="openLightbox('menu/croissant.jpg')">
                    <img src="menu/croissant.jpg" alt="Croissant">
                    <div class="menu-item-name">Croissant</div>
                </div>
                <div class="menu-item" onclick="openLightbox('menu/roti-bakar.jpg')">
                    <img src="menu/roti-bakar.jpg" alt="Roti Bakar">
                    <div class="menu-item-name">Roti Bakar</div>
                </div>
            </div>
        </div>

        <!-- Tambahkan kategori & item baru dengan copy-paste blok di atas -->

    </div>
</div>


<!-- ===== LIGHTBOX ===== -->
<div id="lightbox" class="lightbox" onclick="closeLightbox()">
    <button class="lb-close" onclick="closeLightbox()">✕</button>
    <img id="lbImg" src="" alt="Menu Detail">
</div>


<script>
/* ===== MENU MODAL ===== */
function openMenu(e) {
    e.preventDefault();
    document.getElementById('menuModal').classList.add('active');
    document.body.style.overflow = 'hidden';
}
function closeMenu() {
    document.getElementById('menuModal').classList.remove('active');
    document.body.style.overflow = '';
}
function handleOverlayClick(e) {
    if (e.target === document.getElementById('menuModal')) closeMenu();
}

/* ===== LIGHTBOX ===== */
function openLightbox(src) {
    document.getElementById('lbImg').src = src;
    document.getElementById('lightbox').classList.add('active');
}
function closeLightbox() {
    document.getElementById('lightbox').classList.remove('active');
    document.getElementById('lbImg').src = '';
}

/* ===== KEYBOARD ESC ===== */
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        closeLightbox();
        closeMenu();
    }
});
</script>

</body>
</html>
